name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Build packages
        run: npx turbo run build --filter=@native-mate/core --filter=@native-mate/cli --filter=@native-mate/mcp --filter=@native-mate/registry

      - name: Run tests
        run: npx vitest run

      - name: Lint packages
        run: npx turbo run lint --filter=@native-mate/core --filter=@native-mate/cli --filter=@native-mate/mcp --filter=@native-mate/registry

  # ──────────────────────────────────────────────────────────
  # npm publish — runs on every push to main. Skips versions that
  # are already on the registry; any other failure fails the job.
  # Requires the NPM_TOKEN repo secret: a token from a maintainer
  # account with read-write on the whole @native-mate scope.
  # ──────────────────────────────────────────────────────────
  publish:
    name: Publish to npm
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Build packages
        run: npx turbo run build --filter=@native-mate/core --filter=@native-mate/cli --filter=@native-mate/mcp --filter=@native-mate/registry

      - name: Publish @native-mate/core
        working-directory: packages/core
        run: |
          PKG="$(npm pkg get name | tr -d '"')"; VER="$(npm pkg get version | tr -d '"')"
          ENC="$(printf '%s' "$PKG" | sed 's|/|%2F|')"
          if curl -sf "https://registry.npmjs.org/$ENC/$VER" >/dev/null; then
            echo "$PKG@$VER already on npm — skipping"
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @native-mate/cli
        working-directory: packages/cli
        run: |
          PKG="$(npm pkg get name | tr -d '"')"; VER="$(npm pkg get version | tr -d '"')"
          ENC="$(printf '%s' "$PKG" | sed 's|/|%2F|')"
          if curl -sf "https://registry.npmjs.org/$ENC/$VER" >/dev/null; then
            echo "$PKG@$VER already on npm — skipping"
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @native-mate/mcp
        working-directory: packages/mcp
        run: |
          PKG="$(npm pkg get name | tr -d '"')"; VER="$(npm pkg get version | tr -d '"')"
          ENC="$(printf '%s' "$PKG" | sed 's|/|%2F|')"
          if curl -sf "https://registry.npmjs.org/$ENC/$VER" >/dev/null; then
            echo "$PKG@$VER already on npm — skipping"
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
